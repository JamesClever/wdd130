<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact White Water Rafting for reservations, general inquiries, trip information, and customer support.">
    <meta name="author" content="John Clever Nwali">

    <title>Contact Us | Rapids Adventure Rafting</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.jpg" alt="Rapids Adventure Rafting logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <!-- Contact Header -->

        <section class="contact-header">

            <h1>Rapids Adventure Rafting</h1>

            <address>

                <p>Callari estate, by Samuel Adedoyin St, Eti-Osa, Lekki</p>

                <p>Lagos, Nigeria</p>

                <p>
                    <a href="tel:+2349082832195">+234 908-2832-195</a>
                </p>

                <p>
                    <a href="mailto:boatcruiselagos@gmail.com">
                        boatcruiselagos@gmail.com
                    </a>
                </p>

            </address>

        </section>

        <!-- Contact Information -->

        <section class="contact-content">

            <!-- Google Map -->

            <div class="map-container">

                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3964.724478745278!2d3.433129773562376!3d6.42943089356164!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x103bf5c7cda8803d%3A0x1f056b1bebeae4d3!2sBoat%20Cruise%20Lagos!5e0!3m2!1sen!2sng!4v1785836620561!5m2!1sen!2sng"
                  loading="lazy" allowfullscreen referrerpolicy="strict-origin-when-cross-origin">
                </iframe>

            </div>

            <!-- Contact Form -->

            <div class="form-container">

                <form method="post" action="#">

                    <!-- Name -->

                    <div class="form-group">

                        <label for="fullname">Name</label>

                        <input type="text" id="fullname" name="fullname"
                          placeholder="Enter your full name" required>

                    </div>

                    <!-- Email -->

                    <div class="form-group">

                        <label for="email">Email</label>

                        <input type="email" id="email" name="email" placeholder="Enter your email"
                          required>

                    </div>

                    <!-- Message Purpose -->

                    <fieldset>

                        <legend>Message Purpose</legend>

                        <input type="radio" id="general" name="purpose" value="general" checked>
                        <label for="general">General Inquiry</label>

                        <br>

                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        <label for="reservation">Reservation Question</label>

                        <br>

                        <input type="radio" id="website" name="purpose" value="website">
                        <label for="website">Website Suggestion</label>

                    </fieldset>

                    <!-- Message -->

                    <div class="form-group">

                        <label for="message">Message</label>

                        <textarea id="message" name="message" rows="6"
                          placeholder="Type your message here..." required></textarea>

                    </div>


                    <!-- Newsletter -->

                    <label class="checkbox">
                        <input type="checkbox" id="newsletter" name="newsletter">

                        Please subscribe me to the monthly newsletter
                    </label>


                    <!-- Submit -->

                    <button type="submit">
                        Get in Touch!
                    </button>

                </form>

            </div>

        </section>


        <!-- Employee Profiles -->

        <section class="employee-section">

            <h2>Meet Our Team</h2>

            <div class="employees">

                <figure>
                    <img src="images/grace-adeyemi.png" alt="Operations Manager">
                    <figcaption>Grace Adeyemi - Operations Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/michael-okpara.png" alt="Lead River Guide">
                    <figcaption>Michael Okpara - Lead River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/sarah-john.png" alt="Customer Service Representative">
                    <figcaption>Sarah John - Customer Service Representative</figcaption>
                </figure>

            </div>

        </section>


    </main>

    <footer>
        <p>&copy; 2026 Rapids Adventure Rafting | John Clever Nwali</p>

        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank" rel="noopener noreferrer">
                <img src="images/facebook.png" alt="Facebook">
            </a>

            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">
                <img src="images/instagram.png" alt="Instagram">
            </a>

            <a href="https://x.com" target="_blank" rel="noopener noreferrer">
                <img src="images/twitter.png" alt="X (Twitter)">
            </a>
        </nav>
    </footer>

</body>

</html>
